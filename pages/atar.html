<!DOCTYPE html>
<html class="mcss" lang="en">
<head>
  <meta charset="UTF-8">
  <title>ATAR</title>

  <!-- Stock MIDAS resources. These names are served by mhttpd itself and must
       not be registered in /Custom; see mdqm/install/manifest.py. -->
  <link rel="stylesheet" href="midas.css">
  <script src="controls.js"></script>
  <script src="midas.js"></script>
  <script src="mhttpd.js"></script>
  <script src="mplot.js"></script>
  <script src="mhistory.js"></script>

  <!-- Ours. The ?v= is not decoration: mhttpd stamps Expires:+24h on anything
       served through send_fp(), with no ETag and no Last-Modified, so without a
       version token an edit to these files is invisible for a day. Bump it when
       you change them. (The page itself is exempt: its /Custom key has no dot,
       so it routes through show_custom_page(), which sets no cache headers.) -->
  <link rel="stylesheet" href="dqm.css?v=16">
  <script src="dqm-common.js?v=7"></script>
  <script src="dqm-panels.js?v=11"></script>
  <script src="dqm-page.js?v=6"></script>

  <!-- One page now, so it loads every renderer the four tabs need rather than
       the two or three a single-question page used to. The tabs themselves are
       built lazily -- see showTab() in dqm-page.js -- so loading a renderer is
       not the same as running it: nothing on the Scope tab polls, and no
       histogram is fetched, until somebody opens the tab it is on. -->
  <script src="dqm-brpc.js?v=6"></script>
  <!-- The ATAR channel map, after dqm-page.js because it builds DOM with its
       el() helper, and before the two renderers that ask for the map: the
       baselines on Channels and the waveforms on Scope are the same eight
       layers in the same two columns, read once between them. -->
  <script src="dqm-atar-geom.js?v=6"></script>
  <script src="dqm-hists.js?v=32"></script>
  <script src="dqm-adbanks.js?v=4"></script>
  <script src="dqm-scope.js?v=14"></script>
</head>

<body class="mcss">
  <!-- mhttpd_init() fills these two. -->
  <div id="mheader"></div>
  <div id="msidenav"></div>

  <div id="mmain">
    <div id="dqm-root">
      <div class="dqm-note">Building the ATAR page&hellip;</div>
    </div>
  </div>

  <!-- The spec's name for this page, not its /Custom key: with --prefix the key
       is PIATAR and the URL says page=PIATAR, but the catalogue and the config
       subtree stay keyed on the canonical name. boot() passes the URL's name to
       mhttpd_init() so the sidenav highlight still works. -->
  <script>window.addEventListener("load", function () { DQMPage.boot("ATAR"); });</script>
</body>
</html>
