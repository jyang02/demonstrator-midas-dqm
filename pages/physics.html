<!DOCTYPE html>
<html class="mcss" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics</title>

  <!-- Stock MIDAS resources. These names are served by mhttpd itself and must
       not be registered in /Custom; see mdqm/install/manifest.py. -->
  <link rel="stylesheet" href="midas.css">
  <script src="controls.js"></script>
  <script src="midas.js"></script>
  <script src="mhttpd.js"></script>
  <script src="mplot.js"></script>
  <script src="mhistory.js"></script>

  <!-- Ours. The ?v= is not decoration: mhttpd stamps Expires:+24h on anything
       served through send_fp(), with no ETag and no Last-Modified, so without a
       version token an edit to these files is invisible for a day. Bump it when
       you change them. (The page itself is exempt: its /Custom key has no dot,
       so it routes through show_custom_page(), which sets no cache headers.) -->
  <link rel="stylesheet" href="dqm.css?v=3">
  <script src="dqm-common.js?v=3"></script>
  <script src="dqm-panels.js?v=2"></script>
  <script src="dqm-page.js?v=2"></script>
  <!-- Not for drawing a histogram: this page has none to draw. It is how the
       page checks that no analyzer is answering, rather than asserting it. -->
  <script src="dqm-brpc.js?v=3"></script>
</head>

<body class="mcss">
  <!-- mhttpd_init() fills these two. -->
  <div id="mheader"></div>
  <div id="msidenav"></div>

  <div id="mmain">
    <div id="dqm-root">
      <div class="dqm-note">Building the Physics page&hellip;</div>
    </div>
  </div>

  <!-- The spec's name for this page, not its /Custom key: with --prefix the key
       is PIPhysics and the URL says page=PIPhysics, but the catalogue and the
       config subtree stay keyed on the canonical name. boot() passes the URL's
       name to mhttpd_init() so the sidenav highlight still works. -->
  <script>window.addEventListener("load", function () { DQMPage.boot("Physics"); });</script>
</body>
</html>
