[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdqm"
version = "0.1.0"
description = "Demonstrator shifter DQM: the ATAR8 shift screens as mhttpd custom pages"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# A per-experiment plugin would declare its decoder package here. There is no
# plugin yet: the demonstrator has no documented bank to decode, which is why
# every analyzer-backed panel says it is waiting for one.
dev = ["pytest>=8", "pytest-benchmark>=4", "ruff>=0.5"]

[project.scripts]
mdqm-analyzer = "mdqm.dqm.analyzer:main"
mdqm-register-pages = "mdqm.install.register_pages:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["midas", "numpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
